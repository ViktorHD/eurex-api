[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eurex-mcp"
version = "1.0.0"
description = "MCP server for the Eurex reference-data API (products, contracts, trading hours, tick rules, TES, settlement prices)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "pydantic>=2", "tzdata"]

[project.scripts]
eurex-mcp = "eurex_mcp.server:main"

[tool.setuptools]
packages = ["eurex_mcp"]
